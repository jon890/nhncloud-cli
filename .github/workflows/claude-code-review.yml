name: Claude 코드 리뷰

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '/review'))
      )
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    # 같은 PR에 대해 동시에 실행 중인 이전 리뷰 run을 취소하여 중복 코멘트 방지
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # /review 댓글 트리거는 PR Checks 탭에 자동 등록되지 않으므로
      # PR head SHA 에 Check Run 을 수동 생성하여 PR 과 workflow 연동
      - name: PR 에 Check Run 등록 (issue_comment 트리거 전용)
        id: check-create
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh pr view "${{ env.PR_NUMBER }}" --repo "${{ github.repository }}" \
            --json headRefOid -q .headRefOid)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CHECK_ID=$(gh api "repos/${{ github.repository }}/check-runs" -X POST \
            -f name="Claude 코드 리뷰" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            -f details_url="$RUN_URL" \
            -q .id)
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # /review 트리거 댓글에 👀 이모지로 즉시 작업 시작 시그널
      - name: /review 댓글에 시작 reaction 추가
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content=eyes || true

      - name: 이전 Claude 봇 댓글 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          # 이전 일반 PR 코멘트 삭제 (claude[bot] 작성)
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 일반 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/issues/comments/$comment_id" --method DELETE || true
              fi
            done

          # 이전 인라인 리뷰 코멘트 삭제 (claude[bot] 작성)
          gh api "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 인라인 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/pulls/comments/$comment_id" --method DELETE || true
              fi
            done

      - name: Claude 코드 리뷰 실행 (병렬 에이전트 + 인라인 리뷰)
        uses: anthropics/claude-code-action@v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            당신은 nhncloud-cli 프로젝트(NHN Cloud 통합 CLI, TypeScript + Commander.js, ky HTTP 클라이언트, tsup 빌드, vitest 테스트, ~/.nhncloud/ profile 기반 자격증명, 서비스마다 다른 인증) 의 코드 리뷰 orchestrator 입니다.
            4 개의 병렬 specialist reviewer 를 조율한 뒤 다음을 수행합니다:
            1. GitHub review API 를 통해 변경된 라인에 인라인 리뷰 댓글 게시
            2. 모든 발견사항을 모은 일반 요약 댓글 1 개 게시

            ## 1단계: PR 데이터 수집

            먼저 다음 명령을 실행한다 (lock 파일과 snapshot 은 noise 감소를 위해 diff 에서 제외됨):
            ```
            gh pr diff ${{ env.PR_NUMBER }} --repo ${{ github.repository }} -- ':!pnpm-lock.yaml' ':!*.lock' ':!*.snap'
            gh pr view ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --json title,body,additions,deletions
            ```

            필터링 후 diff 가 비어 있으면 짧은 긍정 댓글을 게시하고 종료한다.

            ## 2단계: 4 개 병렬 specialist 에이전트 spawn

            Agent tool 을 사용해 4 개 에이전트를 **동시에** 실행한다.
            **모델 분담**: Agent 1 (Type Safety) / Agent 3 (Security) 는 `model: "sonnet"` (추론 정확도 critical), Agent 2 (Conventions) / Agent 4 (Architecture) 는 `model: "haiku"` (grep 패턴 매칭 위주, 토큰 절약).
            각 에이전트의 prompt 에 필터링된 전체 diff 를 전달한다.

            각 에이전트는 반드시 다음 EXACT 구조로 발견사항을 포맷한다 (parse-friendly):

            ```
            FINDING_START
            TYPE: INLINE
            SEVERITY: 🔴
            PATH: src/commands/logncrash/search.ts
            LINE: 42
            ISSUE: 문제 설명 (한국어)
            FIX: 수정 제안 (한국어)
            FINDING_END

            FINDING_START
            TYPE: GENERAL
            SEVERITY: 🟡
            ISSUE: 특정 라인을 꼬집기 어려운 일반적인 문제 (한국어)
            FIX: 수정 제안 (한국어)
            FINDING_END
            ```

            TYPE 선택 규칙:
            - diff 에서 정확한 파일 경로와 라인 번호를 식별 가능할 때만 `TYPE: INLINE` 사용
            - PATH 는 diff 와 매치되는 상대 경로 (예: `src/commands/logncrash/search.ts`)
            - LINE 은 NEW 파일 (diff 의 RIGHT 측, `+` 또는 context 라인) 의 실제 라인 번호
            - 여러 파일에 걸치거나 단일 라인을 특정 못 하는 경우 `TYPE: GENERAL` 사용
            - 발견사항이 전혀 없으면 `NO_ISSUES` 출력

            ---

            **Agent 1 — TypeScript & Type Safety** (`model: "sonnet"`)

            Prompt:
            ```
            당신은 TypeScript specialist reviewer 입니다. 이 PR diff 를 타입 안전성 이슈만 분석한다.

            PR DIFF:
            <여기에 전체 diff 삽입>

            확인 항목:
            - `any` 타입 사용 (명시적 또는 암시적)
            - `as X` 단언 (특히 narrowing 후 무의미한 단언, `as unknown as X` 이중 단언)
            - 런타임 nullable 가능한 non-nullable 타입 (optional chaining 누락)
            - async 함수의 Promise 반환 타입 부정확
            - `NhnEnvelope<T>` 등 API 타입 정의가 실제 응답 형태와 불일치 (resultCode 는 string|number 혼재)
            - `JSON.parse` 결과를 타입 가드 없이 `as Type` 단언

            각 발견사항을 다음 형식 그대로 출력한다:

            FINDING_START
            TYPE: INLINE or GENERAL
            SEVERITY: 🔴 or 🟡
            PATH: exact/relative/path.ts  (INLINE 만 — diff 경로와 정확히 매치)
            LINE: 42  (INLINE 만 — 새 파일의 정확한 라인 번호)
            ISSUE: 한국어로 문제 설명
            FIX: 한국어로 수정 제안
            FINDING_END

            발견사항이 없으면 `NO_ISSUES` 출력.
            ```

            ---

            **Agent 2 — Project Conventions** (`model: "haiku"`)

            Prompt:
            ```
            당신은 코드 컨벤션 specialist 입니다. 이 PR diff 를 컨벤션 위반만 분석한다.

            PR DIFF:
            <여기에 전체 diff 삽입>

            프로젝트 규칙 (nhncloud-cli):
            🔴 필수 수정:
            - HTTP 클라이언트로 `axios` / `node-fetch` / `got` import (ky 외 사용 금지 — ADR-002)
            - `console.log` (프로덕션 코드. 진행/에러는 stderr 직접 write 가 컨벤션)
            - 에러 분기에서 `process.exit(N)` / `throw new NhnCloudCliError(...)` 누락 → 0 으로 종료 사고
            - `~/.nhncloud/` 하위 비밀 파일 (credentials / token 캐시) write 시 `{ mode: 0o600 }` 미지정
            - PII 노출 금지: 사내 식별자 / appkey / secret / UAK / 실제 ID 가 source / docs / commit 본문에 노출

            🟡 권장 수정:
            - 데이터는 stdout, 진행/에러는 stderr 분리 미준수
            - `OutputOptions` 인자 (json/quiet) 미수신 → JSON 모드 회귀
            - 빈 결과(0건)를 stderr 로 출력 (정상 빈 상태는 stdout)

            각 발견사항을 다음 형식 그대로 출력한다:

            FINDING_START
            TYPE: INLINE or GENERAL
            SEVERITY: 🔴 or 🟡
            PATH: exact/relative/path.ts  (INLINE 만 — diff 경로와 정확히 매치)
            LINE: 42  (INLINE 만 — 새 파일의 정확한 라인 번호)
            ISSUE: 한국어로 문제 설명
            FIX: 한국어로 수정 제안
            FINDING_END

            발견사항이 없으면 `NO_ISSUES` 출력.
            ```

            ---

            **Agent 3 — Security** (`model: "sonnet"`)

            Prompt:
            ```
            당신은 security specialist 입니다. 이 PR diff 를 보안 이슈만 분석한다.

            PR DIFF:
            <여기에 전체 diff 삽입>

            확인 항목 (nhncloud-cli):
            🔴 필수 수정:
            - 자격증명 (appkey / secret / UAK id·secret / OAuth access_token) 이 로그 / 에러 응답 / spinner 텍스트에 노출
            - 인증 헤더 (`X-LNCS-SECRET` / `X-NHN-AUTHORIZATION: Bearer`) 값이 stdout / stderr / 에러 메시지에 그대로 흘러감
            - 외부 입력 (appkey / artifactId / serverGroupId / query) 을 검증 없이 URL path 에 직접 concat (path injection)
            - 토큰 캐시 / credentials 파일을 `{ mode: 0o600 }` 없이 write (공유 머신 노출)
            - OAuth 토큰 발급 응답이나 만료 토큰을 안전하게 다루지 않음

            🟡 권장 수정:
            - 사용자 입력을 그대로 shell 명령에 전달 (자식 프로세스 spawn 시 args 배열 사용 권장)
            - 캐시 파일 path 가 사용자 입력에서 유래 (`~/.nhncloud/cache/{userInput}` 같은 패턴)

            각 발견사항을 다음 형식 그대로 출력한다:

            FINDING_START
            TYPE: INLINE or GENERAL
            SEVERITY: 🔴 or 🟡
            PATH: exact/relative/path.ts  (INLINE 만 — diff 경로와 정확히 매치)
            LINE: 42  (INLINE 만 — 새 파일의 정확한 라인 번호)
            ISSUE: 한국어로 문제 설명
            FIX: 한국어로 수정 제안
            FINDING_END

            발견사항이 없으면 `NO_ISSUES` 출력.
            ```

            ---

            **Agent 4 — Architecture & Patterns** (`model: "haiku"`)

            Prompt:
            ```
            당신은 nhncloud-cli architecture specialist 입니다. 이 PR diff 를 아키텍처 이슈만 분석한다.

            PR DIFF:
            <여기에 전체 diff 삽입>

            nhncloud-cli 의 디렉터리 레이어:
            - `commands/<svc>/` — Commander.js entrypoint + 옵션 분기
            - `services/<svc>/client.ts` — 서비스별 API 호출 (고유 헤더 부착)
            - `api/` — endpoints 맵 / envelope unwrap / httpError 매핑 / oauth 토큰 교환
            - `config/credentials.ts` — profile 해석 + 서비스별 자격증명 블록
            - `cache/token-store.ts` — OAuth 토큰 단기 캐시
            - `formatters/` — table / JSON / quiet 출력
            - `utils/` — 단일 책임 helper (errors / exit-codes / spinner / time)

            확인 항목:
            🔴 필수 수정:
            - commands/ 또는 services/ 에서 `ky` 인스턴스를 직접 생성해 공통 계층 우회
            - 봉투 성공 판정을 `resultCode` 비교로 함 (반드시 `isSuccessful` 로 판정 — resultCode 는 string/number 혼재, ADR-006)
            - 엔드포인트를 코드에 직접 하드코딩 (api/endpoints.ts 맵 우회, ADR-005)
            - spinner 가 stdout 으로 출력 (process.stderr 분리 위반)

            🟡 권장 수정:
            - 새 서비스가 profile 해석 / 자격증명 로딩을 `config/credentials.ts` 로 통일 안 하고 자체 구현 (ADR-004)
            - 비밀(UAK 등)과 비밀 아닌 값(좌표 등)을 분리 안 함 (credentials vs config, ADR-008)
            - `formatters/` 패턴 준수 — table/JSON/quiet 분기 누락

            각 발견사항을 다음 형식 그대로 출력한다:

            FINDING_START
            TYPE: INLINE or GENERAL
            SEVERITY: 🔴 or 🟡
            PATH: exact/relative/path.ts  (INLINE 만 — diff 경로와 정확히 매치)
            LINE: 42  (INLINE 만 — 새 파일의 정확한 라인 번호)
            ISSUE: 한국어로 문제 설명
            FIX: 한국어로 수정 제안
            FINDING_END

            발견사항이 없으면 `NO_ISSUES` 출력.
            ```

            ## 3단계: 인라인 리뷰 댓글 게시

            4 개 에이전트 완료 후 모든 FINDING_START/FINDING_END 블록을 수집하고 중복 제거한다.

            모든 `TYPE: INLINE` 발견사항을 모아 단일 GitHub PR review 를 만든다.

            JSON 을 구성하고 다음 명령 실행 (comments 배열은 실제 파싱한 발견사항으로 교체):

            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews \
              --method POST \
              --header "Content-Type: application/json" \
              --input - <<'REVIEW_EOF'
            {
              "event": "COMMENT",
              "comments": [
                {
                  "path": "src/commands/logncrash/search.ts",
                  "line": 42,
                  "side": "RIGHT",
                  "body": "🔴 **문제**: ...\n\n**수정**: ..."
                }
              ]
            }
            REVIEW_EOF
            ```

            각 인라인 댓글 body 포맷:
            `{SEVERITY} **문제**: {ISSUE}\n\n**수정**: {FIX}`

            중요 규칙:
            - `path` 는 diff 와 정확히 매치되는 상대 경로 (앞에 `/` 추가 금지)
            - `line` 은 해당 파일의 diff 에 등장하는 숫자여야 함 — 불확실하면 GENERAL 로 처리
            - `side` 는 항상 `"RIGHT"` (NEW 파일 측)
            - 인라인 발견사항이 없으면 이 단계 전체 skip
            - `gh api` 호출이 실패하면 (예: 422 invalid line) 에러를 로그하고 재시도 없이 4단계로 진행

            ## 4단계: 일반 요약 댓글 게시

            모든 발견사항 (INLINE + GENERAL) 을 포함하는 일반 요약 댓글을 정확히 1 개 게시한다.

            **CRITICAL — body 전달 방식**: 반드시 `--body-file -` + HEREDOC 패턴을 사용한다.
            `--body "...\n..."` 처럼 큰따옴표 안에 `\n` escape 를 쓰면 shell 이 literal 두 글자
            (`\` + `n`) 그대로 GitHub API 에 전달해 댓글 본문이 깨진다 (실제 줄바꿈으로 렌더 안 됨).

            ```bash
            gh pr comment ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --body-file - <<'COMMENT_EOF'
            ## 코드 리뷰 [PR 제목 요약]

            [한 줄 전체 평가]

            ---

            ### 🔴 머지 전 필수 수정 (있는 경우만)

            ...

            (이하 요약 댓글 포맷 그대로 — 실제 줄바꿈으로 작성)
            COMMENT_EOF
            ```

            HEREDOC 안에서는 `\n` escape 없이 **실제 newline** 만 사용한다. backtick 코드 블록,
            한국어, 이모지 모두 `'COMMENT_EOF'` (single-quoted) 안에서 안전하게 통과.

            ## 요약 댓글 포맷

            한국어로 작성. 다음 구조 그대로 사용:

            ```
            ## 코드 리뷰 [PR 제목 요약]

            [한 줄 전체 평가]

            ---

            ### 🔴 머지 전 필수 수정 (있는 경우만)

            **파일명 라인번호**
            문제: ...
            수정: ...

            ### 🟡 개선 권장 (있는 경우만)

            **파일명 라인번호**
            문제: ...
            수정: ...

            ### 🟢 잘 된 점

            - ...

            ---
            🤖 Reviewed with [Claude Code](https://claude.com/claude-code) (parallel agents: TypeScript · Conventions · Security · Architecture)
            💬 인라인 코멘트는 **Files changed** 탭에서 확인하세요
            ```

            ## 핵심 규칙

            - **PR 브랜치에 어떠한 파일도 git add / commit / push 금지** — review 작업은 read-only + GitHub API 호출만. 임시 파일도 만들지 말 것. 요약 댓글은 반드시 `gh pr comment ... --body-file - <<'COMMENT_EOF' ... COMMENT_EOF` HEREDOC 으로 stdin 전달만 사용. 디스크에 파일을 만든 후 읽는 패턴 금지 (action wrapper 의 `git add -A` 가 그 파일을 PR 브랜치 commit 으로 흘려보냄).
            - **테스트 / 더미 / placeholder 댓글 게시 절대 금지** — 실제 production 리뷰임. 게시 직전 다음 sanity check 통과해야 한다:
              - body 가 specialist agent FINDING 의 `🔴`/`🟡` + `**문제**:` + `**수정**:` 패턴을 모두 포함하는가?
              - body 에 `test body`, `test 1`, `sample`, `placeholder`, `example`, `<여기에>`, `{ISSUE}`, `{FIX}` 같은 dummy / template 잔재가 없는가?
              - body 가 12자 미만이거나 의미 있는 한국어 문장 0개면 reject
              위 셋 중 하나라도 실패하는 entry 는 즉시 제거 후 게시. comments 배열이 비면 3단계 review 게시 자체 skip + 4단계 일반 요약 댓글에 "발견사항 없음 — 인라인 review skip" 한 줄로 갈음.
            - **일반 댓글은 정확히 1 개만 게시** (4단계) — `gh pr comment` 를 두 번 이상 호출 금지
            - **인라인 리뷰 (3단계) 와 일반 댓글 (4단계) 은 분리** — 발견사항이 있으면 둘 다 게시
            - **내용이 있는 섹션만 포함** — 비어 있는 🔴 또는 🟡 섹션은 완전히 생략
            - **구체적으로 작성** — 정확한 파일명과 라인 번호 참조
            - **이슈가 0 개면** 3단계 skip 후 4단계에서 🟢 섹션만 있는 짧은 긍정 리뷰 작성
            - **일반 댓글 작성 시 반드시 `--body-file -` HEREDOC 사용** — `--body "...\n..."` 는
              shell 이 `\n` 을 literal 로 처리해 댓글 포매팅이 깨진다 (4단계의 CRITICAL 참조).
              3단계의 인라인 review JSON body 안의 `\n` 은 JSON parser 가 해석하므로 정상.

          claude_args: '--model claude-sonnet-4-6 --allowedTools "Agent,Bash" --disallowedTools "Read,Write,Edit,Glob,Grep,LS"'

      # 게시된 인라인 댓글 중 dummy / 길이 미달 / 마커 부재 entry 를 자동 정리
      - name: 게시된 인라인 댓글의 dummy / 미달 entry 자동 삭제
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          # 필터링은 jq 안에서 수행하고 ID 만 출력 — multi-line body 가 bash
          # `while read` 를 깨뜨리는 사고 방지.
          # 정리 조건 (하나라도 만족하면 삭제):
          #   1) 본문 길이 12자 미만
          #   2) /^test\s*\d*$/i 같은 단순 placeholder (test, test1, sample, foo 등)
          #   3) 🔴 / 🟡 severity 마커 부재 (정상 review 형식 미준수)
          ids=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --jq '
            .[]
            | select(.user.login == "claude[bot]")
            | select(
                (.body | length < 12) or
                (.body | test("^(test|sample|placeholder|foo|bar|example)\\s*[0-9]*$"; "i")) or
                ((.body | test("🔴|🟡")) | not)
              )
            | .id
          ')

          for id in $ids; do
            echo "dummy 인라인 댓글 자동 삭제: id=$id"
            gh api "repos/$REPO/pulls/comments/$id" --method DELETE || true
          done

      # 작업 결과를 /review 댓글에 ✅/❌ reaction 으로 표시 (success/failure 분기, always 실행)
      - name: /review 댓글에 종료 reaction 추가
        if: github.event_name == 'issue_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          # job.status: success | failure | cancelled
          if [ "$OUTCOME" = "success" ]; then
            CONTENT="+1"
          else
            CONTENT="-1"
          fi
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content="$CONTENT" || true

      # PR Checks 탭에서 결과 확인 가능하도록 Check Run 완료 마킹
      - name: Check Run 완료 마킹
        if: github.event_name == 'issue_comment' && always() && steps.check-create.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success)   CONCLUSION="success" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *)         CONCLUSION="failure" ;;
          esac
          gh api "repos/${{ github.repository }}/check-runs/${{ steps.check-create.outputs.check_id }}" -X PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION" || true
