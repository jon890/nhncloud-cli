name: Claude 코드 리뷰

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '/review'))
      )
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR 에 Check Run 등록 (issue_comment 트리거 전용)
        id: check-create
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh pr view "${{ env.PR_NUMBER }}" --repo "${{ github.repository }}" \
            --json headRefOid -q .headRefOid)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CHECK_ID=$(gh api "repos/${{ github.repository }}/check-runs" -X POST \
            -f name="Claude 코드 리뷰" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            -f details_url="$RUN_URL" \
            -q .id)
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: /review 댓글에 시작 reaction 추가
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content=eyes || true

      - name: 이전 Claude 봇 댓글 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 일반 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/issues/comments/$comment_id" --method DELETE || true
              fi
            done

          gh api "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 인라인 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/pulls/comments/$comment_id" --method DELETE || true
              fi
            done

      - name: 리뷰 프롬프트 준비 (외부 .txt → 변수 치환)
        id: prompt
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo 'text<<PROMPT_EOF'
            envsubst '$PR_NUMBER $REPO' < .github/workflows/code-review-prompt.txt
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Claude 코드 리뷰 실행 (단일 opus 에이전트 + 인라인 리뷰)
        uses: anthropics/claude-code-action@v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: '--model opus --allowedTools "Bash,Read,Grep,Glob" --disallowedTools "Write,Edit"'

      - name: 게시된 인라인 댓글의 dummy / 미달 entry 자동 삭제
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          ids=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --jq '
            .[]
            | select(.user.login == "claude[bot]")
            | select(
                (.body | length < 12) or
                (.body | test("^(test|sample|placeholder|foo|bar|example)\\s*[0-9]*$"; "i")) or
                ((.body | test("🔴|🟡")) | not)
              )
            | .id
          ')

          for id in $ids; do
            echo "dummy 인라인 댓글 자동 삭제: id=$id"
            gh api "repos/$REPO/pulls/comments/$id" --method DELETE || true
          done

      - name: /review 댓글에 종료 reaction 추가
        if: github.event_name == 'issue_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            CONTENT="+1"
          else
            CONTENT="-1"
          fi
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content="$CONTENT" || true

      - name: Check Run 완료 마킹
        if: github.event_name == 'issue_comment' && always() && steps.check-create.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success)   CONCLUSION="success" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *)         CONCLUSION="failure" ;;
          esac
          gh api "repos/${{ github.repository }}/check-runs/${{ steps.check-create.outputs.check_id }}" -X PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION" || true
