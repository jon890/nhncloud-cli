name: Claude 코드 리뷰

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'claude[bot]' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '/review'))
      )
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR 에 Check Run 등록 (issue_comment 트리거 전용)
        id: check-create
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(gh pr view "${{ env.PR_NUMBER }}" --repo "${{ github.repository }}" \
            --json headRefOid -q .headRefOid)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CHECK_ID=$(gh api "repos/${{ github.repository }}/check-runs" -X POST \
            -f name="Claude 코드 리뷰" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            -f details_url="$RUN_URL" \
            -q .id)
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: /review 댓글에 시작 reaction 추가
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content=eyes || true

      - name: 이전 Claude 봇 댓글 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 일반 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/issues/comments/$comment_id" --method DELETE || true
              fi
            done

          gh api "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .id' \
            | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "오래된 Claude 인라인 댓글 삭제 중: $comment_id"
                gh api "repos/$REPO/pulls/comments/$comment_id" --method DELETE || true
              fi
            done

      - name: Claude 코드 리뷰 실행 (단일 opus 에이전트 + 인라인 리뷰)
        uses: anthropics/claude-code-action@v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            당신은 nhncloud-cli 프로젝트(NHN Cloud 통합 CLI, TypeScript + Commander.js, ky HTTP 클라이언트, tsup 빌드, vitest 테스트, ~/.nhncloud/ profile 기반 자격증명, 서비스마다 다른 인증) 의 **단일 코드 리뷰어**입니다.
            서브 에이전트를 spawn 하지 말고 **당신이 직접** 네 가지 관점(타입 안전성 / 컨벤션 / 보안 / 아키텍처)을 한 번에 검토한 뒤:
            1. GitHub review API 로 변경된 라인에 인라인 리뷰 댓글 게시
            2. 모든 발견사항을 모은 일반 요약 댓글 1 개 게시

            ## 1단계: PR 데이터 수집

            ```
            gh pr diff ${{ env.PR_NUMBER }} --repo ${{ github.repository }} -- ':!pnpm-lock.yaml' ':!*.lock' ':!*.snap'
            gh pr view ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --json title,body,additions,deletions
            ```

            필터링 후 diff 가 비어 있으면 짧은 긍정 댓글을 게시하고 종료한다.
            필요하면 변경된 파일 전체를 Read / Grep 으로 읽어 맥락을 파악한다 (코드 수정·파일 생성은 절대 금지 — read-only).

            ## 2단계: 네 관점 직접 검토

            아래 4개 관점을 모두 직접 점검한다. 각 발견사항은 EXACT 포맷으로 수집한다 (parse-friendly):

            ```
            FINDING_START
            TYPE: INLINE
            SEVERITY: 🔴
            PATH: src/commands/logncrash/search.ts
            LINE: 42
            ISSUE: 문제 설명 (한국어)
            FIX: 수정 제안 (한국어)
            FINDING_END
            ```

            - diff 에서 정확한 파일·라인을 특정 가능할 때만 `TYPE: INLINE` (PATH 는 상대 경로, LINE 은 NEW 측 `+`/context 라인 번호)
            - 특정 불가하면 `TYPE: GENERAL` (PATH/LINE 생략)
            - 발견 0 건이면 마지막에 `NO_ISSUES`

            ### 관점 1 — 타입 안전성
            - `any` / 불필요한 `as X` 단언 / `as unknown as X` 이중 단언
            - nullable 인데 optional chaining 누락, async Promise 반환 타입 부정확
            - `NhnEnvelope<T>` 등 API 타입이 실제 응답과 불일치 (resultCode 는 string|number 혼재)
            - `JSON.parse` 결과를 타입 가드 없이 단언

            ### 관점 2 — 컨벤션 (🔴 필수 / 🟡 권장)
            - 🔴 ky 외 HTTP 클라이언트 import (ADR-002), `console.log` 프로덕션 코드
            - 🔴 에러 분기에서 `NhnCloudCliError` / `process.exit` 누락 → 0 종료 사고
            - 🔴 `~/.nhncloud/` 비밀 파일·디렉터리 mode 누락 (파일 0600 / 디렉터리 0700)
            - 🔴 PII (사내 식별자 / appkey / secret / UAK / 실제 ID) 노출
            - 🟡 데이터=stdout / 진행·에러=stderr 분리 위반, `OutputOptions`(json/quiet) 미수신, 빈 결과를 stderr 출력

            ### 관점 3 — 보안
            - 🔴 자격증명(appkey/secret/UAK/access_token)·인증 헤더(X-LNCS-SECRET / X-NHN-AUTHORIZATION) 가 로그·에러·spinner 에 노출
            - 🔴 외부 입력(appkey/artifactId/query) 을 검증·인코딩 없이 URL path 에 concat → `encodeURIComponent` 권장
            - 🔴 secret 을 cmdline 인수로만 받음 → `ps aux` 노출, env 대안 권장
            - 🟡 사용자 입력 기반 파일 경로(`~/.nhncloud/cache/{입력}`)

            ### 관점 4 — 아키텍처
            - 🔴 commands/ 또는 services/ 에서 `ky` 직접 생성해 공통 계층 우회
            - 🔴 봉투 성공 판정을 `resultCode` 비교로 (반드시 `isSuccessful`, ADR-006)
            - 🔴 엔드포인트 하드코딩 (api/endpoints.ts 맵 우회, ADR-005), spinner 가 stdout 출력
            - 🟡 profile 해석·자격증명 로딩을 `config/credentials.ts` 로 통일 안 함 (ADR-004), 비밀/비밀아님 분리 위반 (ADR-008), formatters table/json/quiet 분기 누락

            ## 3단계: 인라인 리뷰 게시

            모든 `TYPE: INLINE` 발견사항을 모아 단일 GitHub PR review 생성:

            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}/reviews \
              --method POST --header "Content-Type: application/json" --input - <<'REVIEW_EOF'
            {
              "event": "COMMENT",
              "comments": [
                { "path": "src/commands/logncrash/search.ts", "line": 42, "side": "RIGHT",
                  "body": "🔴 **문제**: ...\n\n**수정**: ..." }
              ]
            }
            REVIEW_EOF
            ```

            - `path` 는 diff 와 정확히 매치되는 상대 경로 (앞에 `/` 금지)
            - `line` 은 diff 에 등장하는 숫자 — 불확실하면 GENERAL 처리
            - `side` 는 항상 `"RIGHT"`
            - 인라인 발견사항 없으면 이 단계 skip
            - `gh api` 실패(422 등) 시 로그만 남기고 4단계로 진행

            ## 4단계: 일반 요약 댓글 1 개 게시

            **CRITICAL**: 반드시 `--body-file -` + HEREDOC 사용. `--body "...\n..."` 는 `\n` 이 literal 로 들어가 깨진다.

            ```bash
            gh pr comment ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --body-file - <<'COMMENT_EOF'
            ## 코드 리뷰 [PR 제목 요약]

            [한 줄 전체 평가]

            ---

            ### 🔴 머지 전 필수 수정 (있을 때만)

            **파일명 라인번호**
            문제: ...
            수정: ...

            ### 🟡 개선 권장 (있을 때만)

            **파일명 라인번호**
            문제: ...
            수정: ...

            ### 🟢 잘 된 점

            - ...

            ---
            🤖 Reviewed with [Claude Code](https://claude.com/claude-code) (single opus reviewer: type · conventions · security · architecture)
            💬 인라인 코멘트는 **Files changed** 탭에서 확인하세요
            COMMENT_EOF
            ```

            HEREDOC 안에서는 `\n` escape 없이 실제 newline 만 사용한다.

            ## 핵심 규칙

            - **PR 브랜치에 어떤 파일도 git add / commit / push 금지** — read-only + GitHub API 호출만. 임시 파일 생성 금지 (요약은 HEREDOC stdin 전달만).
            - **테스트 / 더미 / placeholder 댓글 금지** — 실제 production 리뷰. 게시 전 sanity check:
              - body 가 `🔴`/`🟡` + `**문제**:` + `**수정**:` 패턴 포함?
              - `test`, `sample`, `placeholder`, `example`, `<여기에>`, `{ISSUE}`, `{FIX}` 같은 잔재 없음?
              - 12자 미만 / 의미 있는 한국어 0개면 reject
              실패 entry 제거 후 게시. comments 배열 비면 3단계 skip + 4단계에서 "발견사항 없음" 한 줄.
            - **일반 댓글 정확히 1 개** (4단계) — `gh pr comment` 2회 이상 금지
            - **내용 있는 섹션만 포함** — 빈 🔴/🟡 섹션 생략
            - **이슈 0 건이면** 3단계 skip + 4단계 🟢 짧은 긍정 리뷰

          claude_args: '--model claude-opus-4-7 --allowedTools "Bash,Read,Grep,Glob" --disallowedTools "Write,Edit"'

      - name: 게시된 인라인 댓글의 dummy / 미달 entry 자동 삭제
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ env.PR_NUMBER }}"

          ids=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --jq '
            .[]
            | select(.user.login == "claude[bot]")
            | select(
                (.body | length < 12) or
                (.body | test("^(test|sample|placeholder|foo|bar|example)\\s*[0-9]*$"; "i")) or
                ((.body | test("🔴|🟡")) | not)
              )
            | .id
          ')

          for id in $ids; do
            echo "dummy 인라인 댓글 자동 삭제: id=$id"
            gh api "repos/$REPO/pulls/comments/$id" --method DELETE || true
          done

      - name: /review 댓글에 종료 reaction 추가
        if: github.event_name == 'issue_comment' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            CONTENT="+1"
          else
            CONTENT="-1"
          fi
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            --method POST \
            --field content="$CONTENT" || true

      - name: Check Run 완료 마킹
        if: github.event_name == 'issue_comment' && always() && steps.check-create.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success)   CONCLUSION="success" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *)         CONCLUSION="failure" ;;
          esac
          gh api "repos/${{ github.repository }}/check-runs/${{ steps.check-create.outputs.check_id }}" -X PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION" || true
